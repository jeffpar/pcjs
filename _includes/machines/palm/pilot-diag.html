<div id="{{ include.id }}" class="pcjs-chassis-clear">
  <div class="pcjs-chassis-image">
    <img id="imagePilot" title="Palm Pilot" tabindex="0" src="/machines/palm/pilot/images/pilot-off.png" draggable="false" style="display:block; margin:0; outline:none; width:100%; height:auto; user-select:none; touch-action:none;">
    <div id="monitorPilot" class="pcjs-monitor" style="width:68.97%; height:46.87%; top:12.65%; left:16.53%; pointer-events:none;"></div>
  </div>
</div>
<div class="pcjs-diagnostics">
  <div id="diagPilot" style="display:none;">
    <label>Status (<span id="speedPilot">Stopped</span>)<br>
      <textarea id="printPilot" class="pcjs-console" cols="128" rows="20"></textarea>
    </label>
  </div>
  <div style="text-align:right;">
    <button id="debugPilot" aria-expanded="false" aria-controls="diagPilot">Debug</button>
    <button id="resetPilot">Reset</button>
    <button id="runPilot">Run</button>
    <button id="stepPilot">Step</button>
    <button id="clearPilot">Clear</button>
  </div>
</div>
<script>
  (function() {
    let diag = document.getElementById("diagPilot");
    let debug = document.getElementById("debugPilot");
    let showDebugger = function(show) {
      diag.style.display = show? "" : "none";
      debug.setAttribute("aria-expanded", show);
      if (show) {
        let print = document.getElementById("printPilot");
        print.scrollTop = print.scrollHeight;
      }
    };
    debug.addEventListener("click", function() { showDebugger(diag.style.display == "none"); });
    document.getElementById("resetPilot").addEventListener("click", function() { showDebugger(false); });
    //
    // The Run button is a Run/Halt toggle, so we use a capturing listener to see its text before the machine
    // updates it: clicking "Run" closes the debugger.  The debugger is never opened automatically (eg, when the
    // machine stops, which also happens whenever the page is unloaded); only the Debug button opens it.
    //
    let run = document.getElementById("runPilot");
    run.addEventListener("click", function() { if (run.textContent == "Run") showDebugger(false); }, true);
  })();
</script>
