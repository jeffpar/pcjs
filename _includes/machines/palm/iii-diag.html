<div id="{{ include.id }}" class="pcjs-chassis-clear">
  <div class="pcjs-chassis-image">
    <img id="imageIII" title="Palm III" tabindex="0" src="/machines/palm/iii/images/palm-iii.png" draggable="false" style="display:block; margin:0; outline:none; width:100%; height:auto; user-select:none; touch-action:none;">
    <div id="monitorIII" class="pcjs-monitor" style="width:68.97%; height:46.38%; top:12.75%; left:16.81%; pointer-events:none;"></div>
  </div>
</div>
<div class="pcjs-diagnostics">
  <div id="diagIII" style="display:none;">
    <label>Status (<span id="speedIII">Stopped</span>)<br>
      <textarea id="printIII" class="pcjs-console" cols="128" rows="20"></textarea>
    </label>
  </div>
  <div style="text-align:right;">
    <button id="debugIII" aria-expanded="false" aria-controls="diagIII">Debug</button>
    <button id="resetIII">Reset</button>
    <button id="runIII">Run</button>
    <button id="stepIII">Step</button>
    <button id="clearIII">Clear</button>
  </div>
</div>
<script>
  (function() {
    let diag = document.getElementById("diagIII");
    let debug = document.getElementById("debugIII");
    let showDebugger = function(show) {
      diag.style.display = show? "" : "none";
      debug.setAttribute("aria-expanded", show);
      if (show) {
        let print = document.getElementById("printIII");
        print.scrollTop = print.scrollHeight;
      }
    };
    debug.addEventListener("click", function() { showDebugger(diag.style.display == "none"); });
    document.getElementById("resetIII").addEventListener("click", function() { showDebugger(false); });
    //
    // The Run button is a Run/Halt toggle, so we use a capturing listener to see its text before the machine
    // updates it: clicking "Run" closes the debugger.  And whenever the machine stops on its own (eg, at a
    // breakpoint), the button's text changes from "Halt" to "Run", at which point we open the debugger.
    //
    let run = document.getElementById("runIII");
    run.addEventListener("click", function() { if (run.textContent == "Run") showDebugger(false); }, true);
    let textRun = run.textContent;
    new MutationObserver(function() {
      if (textRun == "Halt" && run.textContent == "Run") showDebugger(true);
      textRun = run.textContent;
    }).observe(run, {childList: true, characterData: true, subtree: true});
  })();
</script>
